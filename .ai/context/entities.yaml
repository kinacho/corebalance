entities:
  - name: "Asset"
    fields:
      ticker: "string"
      name: "string"
      isin: "string"
      targetWeight: "number"
      color: "string"
      icon: "string"
      ter: "number"
      category: "AssetCategory ('core' | 'satellite' | 'stocks')"
      manualInterestRate: "number (optional)"

  - name: "PriceData"
    fields:
      price: "number"
      currency: "string"
      name: "string"
      change: "number"
      sparkline: "number[] (optional)"
      fxRate: "number (optional)"

  - name: "PortfolioPosition"
    fields:
      asset: "Asset"
      holdings: "number"
      avgCost: "number"
      totalCost: "number"
      unitPrice: "number"
      totalValue: "number"
      currentWeight: "number"
      deviation: "number"
      targetValue: "number"
      targetHoldings: "number"
      profit: "number"
      profitPercent: "number"

  - name: "Transaction"
    fields:
      id: "string"
      ticker: "string"
      type: "TransactionType ('buy' | 'sell' | 'dividend' | 'transfer' | 'initial_balance')"
      date: "number (timestamp)"
      shares: "number"
      price: "number"
      currency: "string"
      fees: "number"
      fxRate: "number"
      notes: "string (optional)"

  - name: "HoldingData"
    fields:
      shares: "number"
      avgCost: "number"
      totalCostBase: "number"
      useLedger: "boolean"
      accruedInterest: "number"
