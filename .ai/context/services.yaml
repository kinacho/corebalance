services:
  - name: "Firebase Auth"
    type: "external"
    purpose: "User authentication via Google login"
    dependency: "firebase/auth"
  
  - name: "Firebase Firestore"
    type: "external"
    purpose: "Optional cloud syncing of portfolio data"
    dependency: "firebase/firestore"

  - name: "Upstash Redis"
    type: "external"
    purpose: "Caching pricing API calls to Yahoo Finance / FT"
    dependency: "@upstash/redis"

  - name: "Yahoo Finance & Financial Times APIs"
    type: "external"
    purpose: "Retrieving quotes, asset names, sparkline history, and YTD performance"
    dependency: "yahoo-finance2"
