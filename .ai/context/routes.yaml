routes:
  - path: "/"
    type: "public"
    purpose: "Marketing / landing page with features overview"
  
  - path: "/dashboard"
    type: "private/local"
    purpose: "Main application containing assets list, rebalancing engine, simulator, and ledger"
  
  - path: "/privacy"
    type: "public"
    purpose: "Privacy Policy"

  - path: "/terms"
    type: "public"
    purpose: "Terms of Service"

  - path: "/cookies"
    type: "public"
    purpose: "Cookie Policy"

api_endpoints:
  - path: "/api/prices"
    method: "GET"
    purpose: "Fetch ticker prices with caching"

  - path: "/api/resolve"
    method: "POST"
    purpose: "Resolve tickers/ISINs to market tickers"

  - path: "/api/search"
    method: "GET"
    purpose: "Search yahoo finance tickers"
    
  - path: "/api/support"
    method: "POST"
    purpose: "Submit user feedback or support requests"
