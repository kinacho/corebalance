decisions:
  - date: "2026-06-11"
    title: "Svelte 5 Runes Adoption"
    status: "approved"
    context: "Requires performant, readable reactive UI state."
    consequence: "Uses Svelte 5 Runes ($state, $derived, $effect) exclusively in UI components."

  - date: "2026-06-11"
    title: "Local-First with Dexie.js (IndexedDB)"
    status: "approved"
    context: "Financial data privacy requires zero serverside storage by default."
    consequence: "Data is saved locally in IndexedDB using Dexie wrappers. Unauthenticated use works fully."

  - date: "2026-06-11"
    title: "Tailwind CSS v4 with Vite"
    status: "approved"
    context: "Wanted new CSS-first styling config and faster builds."
    consequence: "Styled with Tailwind 4. Uses `@tailwindcss/vite` in `vite.config.ts` without tailwind.config.js."

  - date: "2026-06-11"
    title: "Optional Cloud Mirroring"
    status: "approved"
    context: "Allow syncing across devices without forcing database accounts on everyone."
    consequence: "Uses Firebase Auth/Firestore. Mirrors local DB state to the cloud only when authenticated."
