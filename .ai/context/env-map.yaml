variables:
  - name: "VITE_FIREBASE_API_KEY"
    scope: "client"
    purpose: "API key for Firebase services"
    required: false
  
  - name: "VITE_FIREBASE_AUTH_DOMAIN"
    scope: "client"
    purpose: "Firebase Auth configuration domain"
    required: false

  - name: "VITE_FIREBASE_PROJECT_ID"
    scope: "client"
    purpose: "Firebase Firestore/App project ID"
    required: false

  - name: "VITE_FIREBASE_STORAGE_BUCKET"
    scope: "client"
    purpose: "Storage configuration for Firebase"
    required: false

  - name: "VITE_FIREBASE_MESSAGING_SENDER_ID"
    scope: "client"
    purpose: "Sender identification for Firebase cloud messaging"
    required: false

  - name: "VITE_FIREBASE_APP_ID"
    scope: "client"
    purpose: "Firebase app identification"
    required: false

  - name: "KV_REST_API_URL"
    scope: "server"
    purpose: "Upstash Redis connection endpoint (REST)"
    required: true

  - name: "KV_REST_API_TOKEN"
    scope: "server"
    purpose: "Upstash Redis authentication token"
    required: true
