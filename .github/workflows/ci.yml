name: CI

# Se ejecuta en los dos momentos que sirven para algo distinto:
#   - `pull_request`: avisa **antes** de que nada llegue a `main`.
#   - `push` a `main`: red de seguridad para los merges directos.
#
# Existe por un motivo concreto: hasta ahora estas comprobaciones se lanzaban a
# mano, y eso falla de dos maneras. Una, que alguien no se acuerde. Y otra que ya
# ha pasado: validar un build leyendo su salida con `grep` en vez de su código de
# salida — `grep -c 'rror:'` no casa con `error during build:` y daba verde con el
# build roto. Un runner no interpreta texto, mira el código de salida.
on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela el anterior: no tiene sentido pagar
# minutos por verificar un commit que ya está superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, tests, build y auditoría SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # `node-version-file` en vez de una versión escrita aquí: así la de CI y la
      # de la máquina de desarrollo salen del mismo sitio y no pueden divergir sin
      # que se note.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` y no `npm install`: respeta el lockfile en vez de reescribirlo. Y
      # eso importa aquí — un `npm install` local movió cinco dependencias
      # transitivas de paso, escondiendo un cambio de dependencias dentro de un
      # commit de interfaz.
      - name: Instalar dependencias
        run: npm ci

      # ⚠️ Imprescindible, y está documentado en el README: SvelteKit genera los
      # tipos de `$env/static/public` a partir de las variables que existen, así
      # que sin este fichero `npm run check` falla con
      # `Module '"$env/static/public"' has no exported member 'PUBLIC_USE_FIREBASE'`.
      # Con los valores de ejemplo basta: ninguna comprobación necesita secretos
      # reales.
      - name: Preparar entorno de ejemplo
        run: cp .env.example .env

      - name: Comprobación de tipos
        run: npm run check

      # La quinta guarda mecánica. Va antes que los tests porque es la más rápida
      # —analiza CSS, no ejecuta nada— y porque su fallo es el más fácil de leer:
      # dice el fichero, el color y el ratio.
      #
      # Existe porque 212 declaraciones de texto estaban por debajo de AA y nada en
      # este pipeline se ponía rojo: el proyecto se enteró por tres comentarios en
      # un foro. Un barrido sin guarda se deshace solo — de eso hay prueba en el
      # propio repo, con los 128 literales de `#3b82f6` que sobrevivieron a la
      # migración de `--accent-blue`.
      - name: Contraste de texto (WCAG AA)
        run: npm run a11y:contrast

      # `test:coverage` en vez de `test`: los mismos tests más los umbrales de
      # cobertura por fichero de los seis módulos donde equivocarse cuesta dinero al
      # usuario. Los umbrales son la medida del día que se pusieron, así que solo
      # pueden subir: código nuevo sin probar en el motor fiscal rompe el pipeline.
      #
      # Aquí entran también, como tests normales, las dos guardias de la capa 0: la
      # deriva de `CLAUDE.md` (`scripts/doc-drift.test.ts`) y los tests que no pueden
      # fallar (`scripts/test-quality.test.ts`).
      - name: Tests y cobertura
        run: npm run test:coverage

      # `build` lanza antes su `prebuild`, que regenera iconos, imágenes OG y los
      # llms.txt. Que eso funcione en una máquina limpia es parte de lo que se
      # comprueba.
      - name: Build de producción
        run: npm run build

      # Necesita el build hecho: audita el HTML ya generado. Sólo falla por
      # errores; los avisos no rompen.
      - name: Auditoría SEO del HTML construido
        run: npm run seo:audit

  # Job aparte, y a propósito: los E2E necesitan navegador (~1 min de instalación) y
  # el build hecho. En su propio job corren en paralelo con el de tipos y tests, así
  # que no alargan el pipeline, y un fallo aquí se lee sin mezclarse con los unitarios.
  e2e:
    name: E2E sobre el build (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar entorno de ejemplo
        run: cp .env.example .env

      # Solo Chromium: estos specs comprueban la app y su service worker, no
      # compatibilidad entre motores.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # ⚠️ Imprescindible: los specs corren sobre `vite preview`, que sirve el build.
      # Sin build, `preview` arranca y devuelve 404 en todo.
      - name: Build de producción
        run: npm run build

      - name: E2E
        run: npm run test:e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
