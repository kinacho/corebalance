<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a16" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="CoreBalance" />
		<meta name="description" content="Rebalancea tu cartera de fondos indexados y ETFs gratis con CoreBalance. La calculadora definitiva para optimizar tu asset allocation de forma local y privada." />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<link rel="apple-touch-icon" href="/pwa-192x192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.png" />
		<script>
			window.__deferredPrompt = null;
			window.addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
				window.__deferredPrompt = e;
				window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
				console.log('✅ beforeinstallprompt capturado');
			});
			window.addEventListener('appinstalled', () => {
				window.__deferredPrompt = null;
				console.log('✅ PWA instalada');
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Verificación inmediata para evitar mostrar splash en la landing si no es necesario
			(function() {
				const path = window.location.pathname;
				let hasData = false;
				try {
					const saved = localStorage.getItem('corebalance_holdings_v2');
					if (saved) {
						const parsed = JSON.parse(saved);
						hasData = Object.values(parsed).some(h => h.shares > 0);
					}
				} catch(e) { console.warn('[CoreBalance] Error leyendo localStorage en splash:', e); }
				const isBypassed = sessionStorage.getItem('bypassLanding') === 'true';
				
				// Solo queremos splash si vamos al dashboard o si vamos a redirigir desde la landing
				const needsSplash = path === '/dashboard' || (path === '/' && (hasData || isBypassed));
				
				if (!needsSplash) {
					document.body.classList.add('no-splash-needed');
				}
			})();
		</script>

		<style>
			.no-splash-needed #initial-splash { display: none !important; }
		</style>

		<!-- Initial Splash Screen (Static) -->
		<div id="initial-splash" style="position: fixed; inset: 0; background: #05050a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: opacity 0.5s ease; font-family: 'Plus Jakarta Sans', sans-serif;">
			<div style="position: absolute; inset: 0; background: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.25) 0, transparent 50%), radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0, transparent 50%), radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.1) 0, transparent 70%); filter: blur(60px); opacity: 0.8;"></div>
			<div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; width: 100%; max-width: 320px; padding: 2rem;">
				<div style="position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;">
					<img src="/logo.webp" alt="Logo" style="width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3));" />
				</div>
				<div style="text-align: center;">
					<h1 style="font-size: 2.25rem; font-weight: 900; color: #fff; margin: 0; letter-spacing: -0.04em;">CoreBalance</h1>
					<p style="font-size: 0.85rem; font-weight: 500; color: rgba(255, 255, 255, 0.4); margin: 0.5rem 0 0 0; text-transform: uppercase; letter-spacing: 0.15em;">Portfolio Dashboard</p>
				</div>
				<div style="width: 100%; height: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.03);">
					<style>
						@keyframes splashProgress {
							0% { width: 0%; }
							100% { width: 95%; }
						}
					</style>
					<div id="initial-bar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #60a5fa, #10b981); border-radius: 10px; animation: splashProgress 4s cubic-bezier(0.1, 0, 0.2, 1) forwards; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);"></div>
				</div>
			</div>
		</div>

		<script>
			// Limpieza de splash cuando el JS esté listo
			(function() {
				window.__hideInitialSplash = function() {
					const splash = document.getElementById('initial-splash');
					if (splash) {
						splash.style.opacity = '0';
						setTimeout(() => splash.remove(), 500);
					}
				};
			})();
		</script>

		<!-- Noise Filter -->
		<svg style="display: none;">
			<filter id="noiseFilter">
				<feTurbulence type="fractalNoise" baseFrequency="0.6" stitchTiles="stitch" />
				<feColorMatrix type="saturate" values="0" />
			</filter>
		</svg>
		<div class="noise-overlay"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
