<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a16" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="CoreBalance" />
		<meta name="description" content="Dashboard de inversión personalizable con rebalanceo automático" />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="preload" href="/fonts/plus-jakarta-sans-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="stylesheet" href="/fonts/fonts.css" />
		<link rel="apple-touch-icon" href="/pwa-192x192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.png" />
		<script>
			window.__deferredPrompt = null;
			window.addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
				window.__deferredPrompt = e;
				window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
				console.log('✅ beforeinstallprompt capturado');
			});
			window.addEventListener('appinstalled', () => {
				window.__deferredPrompt = null;
				console.log('✅ PWA instalada');
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Noise Filter -->
		<svg style="display: none;">
			<filter id="noiseFilter">
				<feTurbulence type="fractalNoise" baseFrequency="0.6" stitchTiles="stitch" />
				<feColorMatrix type="saturate" values="0" />
			</filter>
		</svg>
		<div class="noise-overlay"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
